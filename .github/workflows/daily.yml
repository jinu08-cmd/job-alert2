name: Daily Job Scan

on:
  schedule:
    # UTC 기준 00:00 = 한국시간(KST) 09:00. 원하는 시간으로 바꾸려면
    # "분 시 * * *" 형식에서 시(hour) 값을 (원하는 KST 시각 - 9)로 설정하세요.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 공고 수집 및 대시보드 생성
        run: python main.py

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json docs/index.html
          git diff --cached --quiet || git commit -m "채용 공고 자동 업데이트 $(date +'%Y-%m-%d %H:%M')"
          git push
